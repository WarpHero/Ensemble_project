paths:
  train: '/content/dataSet/train2017'
  val: '/content/dataSets/val2017'
  annotations:
    train: '/content/drive/MyDrive/coco/annotations/instances_train2017.json'
    val: '/content/drive/MyDrive/coco/annotations/instances_val2017.json'

augmentation:
  train:
    horizontal_flip: 0.5
    vertical_flip: 0.0
    random_crop: true
    color_jitter: true
  val:
    resize_only: true

dataloader:
  num_workers: 4
  pin_memory: true
  shuffle: true

dataset:
  name: "coco"
  num_classes: 80
  class_names: [
    person, bicycle, car, motorcycle, airplane, bus, train, truck, boat, traffic light,
    fire hydrant, stop sign, parking meter, bench, bird, cat, dog, horse, sheep, cow,
    elephant, bear, zebra, giraffe, backpack, umbrella, handbag, tie, suitcase, frisbee,
    skis, snowboard, sports ball, kite, baseball bat, baseball glove, skateboard, surfboard,
    tennis racket, bottle, wine glass, cup, fork, knife, spoon, bowl, banana, apple,
    sandwich, orange, broccoli, carrot, hot dog, pizza, donut, cake, chair, couch,
    potted plant, bed, dining table, toilet, tv, laptop, mouse, remote, keyboard,
    cell phone, microwave, oven, toaster, sink, refrigerator, book, clock, vase,
    scissors, teddy bear, hair drier, toothbrush
  ]
  background_class: true
  file_names:
    train: "instances_train2017.json"
    val: "instances_val2017.json"
    
  # 상대 경로 사용
  # train:
  #   images: "{data_root}/train2017"
  #   annotations: "{annotation_path}/instances_train2017.json"
  # val:
  #   images: "{data_root}/val2017"
  #   annotations: "{annotation_path}/instances_val2017.json"